{% extends "layout.html" %}
{% block content %}
<main class="context px-3 py-4">
    <div class="container-fluid">
        <div class="mb-3">
            <h3 class="card-title mb-4 fw-bold text-dark">Meu Perfil</h3>
            <div class="row">
                <div class="position-relative d-inline-block mb-4">
                    <form action="{{url_for('perfil_usuario')}}" method="post" enctype="multipart/form-data">
                        <img src="{{url_for('static', filename='img/'+usuario.foto)}}"
                            class="rounded-circle object-fit-cover shadow-sm border border-3 border-light"
                            alt="foto-perfil" style="width: 280px; height: 280px;">
                        <div class="mb-4 text-start">
                            <label for="foto" class="form-label small fw-bold text-secondary">Alterar foto de
                                perfil</label>
                            <input class="form-control form-control-sm rounded-3" type="file" name="foto" id="foto"
                                accept="image/*">
                        </div>
                        <button type="submit" class="btn btn-primary">Salvar Alterações</button>
                    </form>
                </div>
                <div class="col-md-12">
                    <label class="form-label">Nome</label>
                    <input type="text" class="form-control" id="nome_usuario" name="nome_usuario"
                        value="{{usuario.nome}}" readonly>
                </div>
                <div class="col-md-12">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="email_usuario" name="email_usuario"
                        value="{{usuario.email}}" readonly>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Departameto</label>
                    <input type="text" class="form-control" id="departamento_usuario" name="departamento_usuario"
                        value="{{usuario.departamento}}" readonly>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Ramal</label>
                    <input type="text" class="form-control" id="ramal_usuario" name="ramal_usuario"
                        value="{{usuario.ramal}}" readonly>
                </div>
                <div class="col-md-4">
                    <label for="status" class="form-label">Status</label>
                    <input type="text" class="form-control" value="{{usuario.status}}" readonly>
                    </select>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
