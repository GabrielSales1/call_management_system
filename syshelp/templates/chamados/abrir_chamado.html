{% extends "layout.html" %}
{% block content %}
<main class="context px-3 py-4">
    <div class="container-fluid">
        <div class="mb-3">
            <h3 class="fw-bold fs-4 mb-3">Abrir Chamado</h3>
            <form class="row g-3" method="post" action="{{url_for('salvar')}}">
                <div class="col-md-12">
                    <label for="titulo" class="form-label">Titulo <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="titulo" name="titulo">
                </div>
                <div class="col-md-12">
                    <label for="descricao" class="form-label">Descrição <span class="text-danger">*</span></label>
                    <div class="form-floating">
                        <textarea class="form-control" placeholder="Descrição" id="descricao" name="descricao"
                            style="height: 100px"></textarea>
                        <label for="descricao">Descrição</label>
                    </div>
                </div>
                <div class="col-6">
                    <label for="data-abertura" class="form-label">Data de Abertura</label>
                    <input type="date" class="form-control" id="data_abertura" name="data_abertura">
                </div>
                <div class="col-6">
                    <label for="data-fechamento" class="form-label">Data de Fechamento</label>
                    <input type="date" class="form-control" id="data_fechamento" name="data_fechamento">
                </div>
                <div class="col-md-4">
                    <label for="status" class="form-label">Status</label>
                    <select id="status" name="status" class="form-select">
                        <option selected>Escolha...</option>
                        <option value="aberto">Aberto</option>
                        <option value="atendimento">Em Atendimento</option>
                        <option value="resolvido">Resolvido</option>
                        <option value="fechado">Fechado</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="prioridade" class="form-label">Prioridade</label>
                    <select id="prioridade" name="prioridade" class="form-select">
                        <option selected>Escolha...</option>
                        <option value="baixa">Baixa</option>
                        <option value="media">Média</option>
                        <option value="alta">Alta</option>
                        <option value="critica">Crítica</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label for="categoria" class="form-label">Categoria</label>
                    <select id="categoria" name="categoria" class="form-select">
                        <option selected>Escolha...</option>
                        <option value="hardware">Hardware</option>
                        <option value="software">Software</option>
                        <option value="rede">Rede</option>
                        <option value="acesso">Acesso</option>
                        <option value="outro">Outros</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="tecnico" class="form-label">Técnico Encarregado</label>
                    <select id="tecnico" name="tecnico" class="form-select">

                        <option selected>Escolha...</option>
                        {% for user in users %}
                        <option value="{{ user.id }}">{{ user.nome }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12 d-grid">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</main>
{% endblock %}
