<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />   
    <link rel="stylesheet" href="../static/style.css">
    <title>Syshelp</title>
</head>
<body>
    <div class="d-flex">
        <aside class="min-vh-100 bg-dark w-25 p-3 d-flex flex-column">
            <div class="mb-4 fw-bold text-center text-white fs-3" style="letter-spacing: 5px;">
                <span>SYSHELP</span>
                <hr class="border border-white">
            </div>

              <nav class="nav flex-column">
                <a href="#" class="nav-link text-white fs-5 mb-4">
                <i class="fa-regular fa-user"></i>
                    Perfil
                </a>

                <a href="#" class="nav-link text-white fs-5 mb-4">
                    <i class="fa-solid fa-chart-line"></i>
                    Dashboard
                </a>

                <div class="accordion border-0 bg-dark mb-4 " id="accordionChamados">
                    <div class="accordion-item bg-dark border-0 ">

                        <h2 class="accordion-header dropdown-style">
                            <button class="nav-link text-white fs-5 d-flex justify-content-between align-items-center"
                            type="button" data-bs-toggle="collapse"
                            data-bs-target="#chamadosCollapse"
                            aria-expanded="false">
                                <span><i class="fa-regular fa-folder-open me-2"></i> Gerenciar chamados</span>
                                <i class="fa-solid fa-chevron-down rotate-icon m-2"></i>
                            </button>
                        </h2>

                        <div id="chamadosCollapse" class="accordion-collapse collapse ">
                            <div class="accordion-body bg-dark p-0 ms-4">
                                <a href="#" class="nav-link text-white mb-2"><i class="fa-solid fa-plus-circle me-2"></i>Abrir chamado</a>
                                <a href="#" class="nav-link text-white mb-2"><i class="fa-solid fa-list me-2"></i>Listar</a>
                                <a href="#" class="nav-link text-white mb-2"><i class="fa-solid fa-user-check me-2"></i>Atribuir</a>
                                <a href="#" class="nav-link text-white mb-2"><i class="fa-solid fa-arrows-rotate me-2"></i>Atualizar status</a>
                                <a href="#" class="nav-link text-white mb-2"><i class="fa-solid fa-circle-check me-2"></i>Encerrar</a>
                                <a href="#" class="nav-link text-white mb-2"><i class="fa-solid fa-clock-rotate-left me-2"></i>Histórico</a>

                            </div>
                        </div>
                    </div>
                </div>

                <div class="accordion border-0 bg-dark mb-4 " id="accordionUser">
                    <div class="accordion-item bg-dark border-0 ">

                        <h2 class="accordion-header dropdown-style">
                            <button class="nav-link text-white fs-5 d-flex justify-content-between align-items-center"
                            type="button" data-bs-toggle="collapse"
                            data-bs-target="#userCollapse"
                            aria-expanded="false">
                                <span><i class="fa-regular fa-address-card"></i> Gerenciar usuários</span>
                                <i class="fa-solid fa-chevron-down rotate-icon m-2"></i>
                            </button>
                        </h2>

                        <div id="userCollapse" class="accordion-collapse collapse ">
                            <div class="accordion-body bg-dark p-0 ms-4">
                                <a href="#" class="nav-link text-white mb-2"><i class="fa-solid fa-user-plus me-2"></i>Cadastrar</a>
                                <a href="#" class="nav-link text-white mb-2"><i class="fa-solid fa-list me-2"></i>Listar usuários</a>
                            </div>
                        </div>
                    </div>
              </nav>  
                        <a href="#" class="nav-link text-white fs-5 mt-auto">
        <i class="fa-solid fa-right-from-bracket me-2"></i>
        Sair
    </a>

        </aside>

        <main>
            <div class="container">
               <div class="row">
                   <div>
                        <h2>Dashboard</h2>
                    </div>
               </div>
            </div>
        </main>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
